global
    # Keep logs simple for this exercise — send them to stdout so
    # `docker logs haproxy` shows them.
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# The client-facing entry point. This is the ONE thing that used to point
# straight at a single nginx-gateway container; now it points at a pool of
# two, so nginx-gateway itself is no longer a single point of failure.
frontend http_front
    bind *:8000
    default_backend nginx_gateways

backend nginx_gateways
    balance roundrobin

    # option httpchk turns on ACTIVE health checking — HAProxy itself
    # polls each gateway's /heartbeat on an interval, the same idea as your
    # Go gateway's ticker, and completely unlike nginx open-source's
    # passive-only checking. This is a free feature in plain HAProxy,
    # worth noticing as a contrast to the nginx-vs-Go-gateway lesson.
    option httpchk GET /heartbeat
    http-check expect status 200

    # "check" enables the active check above for this server; "inter 5s"
    # matches the same 5s interval your Go gateway's heartbeat monitor uses,
    # so the two are easy to compare. "fall 2" means 2 consecutive failed
    # checks before a server is marked down; "rise 2" means 2 consecutive
    # successful checks before it's trusted again.
    server nginx-gateway-1 nginx-gateway-1:8000 check inter 5s fall 2 rise 2
    server nginx-gateway-2 nginx-gateway-2:8000 check inter 5s fall 2 rise 2

# A small built-in dashboard so you can *see* load balancing and health
# checks happening instead of just reading logs. Open http://localhost:8404/stats
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
