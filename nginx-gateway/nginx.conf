events {}

http {
    # An "upstream" is nginx's name for a pool of backends behind one
    # logical name. With no load_balancing directive specified, nginx
    # defaults to round-robin — the same policy your Go gateway implements
    # by hand with an atomic counter.
    #
    # max_fails / fail_timeout give nginx open-source's version of health
    # checking: it's *passive*, not active like your Go gateway's ticker
    # that polls /heartbeat every 5s. nginx doesn't probe backends on its
    # own; it watches real requests, and after `max_fails` failures within
    # `fail_timeout`, it stops sending new requests to that backend for
    # `fail_timeout`, then tries it again. (Active health checks like your
    # Go gateway's are an nginx-plus feature, or something Traefik gives
    # you for free.)
    upstream backend_pool {
        server backend-1:8080 max_fails=3 fail_timeout=30s;
        server backend-2:8080 max_fails=3 fail_timeout=30s;
        server backend-3:8080 max_fails=3 fail_timeout=30s;

        # Other load-balancing policies you could swap in instead of the
        # implicit round-robin, to compare against your Go gateway:
        #   least_conn;                 # send to whichever backend has fewest active connections
        #   ip_hash;                    # same client IP always hits the same backend (sticky sessions)
    }

    server {
        listen 8000;

        location /items {
            proxy_pass http://backend_pool;

            # Forward the original request's identifying info so the
            # backend can still see who really made the request, not just
            # "nginx". This is standard reverse-proxy hygiene.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /heartbeat {
            add_header Content-Type text/plain;
            return 200 "nginx gateway alive";
        }
    }
}
